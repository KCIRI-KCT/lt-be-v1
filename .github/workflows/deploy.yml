name: Deploy Backend to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy Backend & Run Migrations
        run: |
          cd /opt/lt-construction/lt-be-v1
          git pull origin main
          
          cd /opt/lt-construction
          # Rebuild and recreate backend and celery worker
          docker compose build backend
          docker compose up -d --no-deps backend celery_worker
          
          # Run Database Migrations & Collect Static directly
          docker compose exec -T backend python manage.py migrate --noinput
          docker compose exec -T backend python manage.py collectstatic --noinput
          
          # Reload gateway routes
          docker compose restart gateway